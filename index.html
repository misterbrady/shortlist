// Shared by the page and the Node test. Decrypts an openssl "Salted__" AES-256-CBC/PBKDF2-SHA256 payload.
async function decryptPayload(b64, password, iterations) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const magic = new TextDecoder().decode(raw.slice(0, 8));
  if (magic !== "Salted__") throw new Error("bad payload");
  const salt = raw.slice(8, 16), data = raw.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations }, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, data);
  return new TextDecoder().decode(plain);
}
